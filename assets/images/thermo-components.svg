<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 440" width="100%" height="100%">
  <rect width="750" height="440" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <text x="375" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#24292f">VAPOUR-COMPRESSION REFRIGERATION CIRCUIT SCHEMATIC</text>

  <!-- High-Side Boundary (Red Background tint top) -->
  <rect x="50" y="55" width="650" height="150" fill="#fee2e2" opacity="0.3" rx="4"/>
  <text x="70" y="75" font-family="monospace" font-size="11" font-weight="bold" fill="#dc2626">HIGH-PRESSURE SIDE (DISCHARGE &amp; CONDENSING)</text>

  <!-- Low-Side Boundary (Blue Background tint bottom) -->
  <rect x="50" y="245" width="650" height="150" fill="#e0f2fe" opacity="0.4" rx="4"/>
  <text x="70" y="265" font-family="monospace" font-size="11" font-weight="bold" fill="#0284c7">LOW-PRESSURE SIDE (SUCTION &amp; EVAPORATING)</text>

  <!-- 1. Compressor (Right middle) -->
  <g transform="translate(560, 160)">
    <circle cx="50" cy="50" r="45" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5"/>
    <text x="50" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#24292f">COMPRESSOR</text>
    <text x="50" y="64" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Vapour Pump</text>
  </g>

  <!-- Discharge Line to Condenser -->
  <path d="M575 160 L575 110 L450 110" fill="none" stroke="#dc2626" stroke-width="3"/>
  <polygon points="460,105 445,110 460,115" fill="#dc2626"/>
  <text x="510" y="100" font-family="monospace" font-size="10" fill="#dc2626">Hot Gas Discharge</text>

  <!-- 2. Condenser (Top Left/Center) -->
  <g transform="translate(180, 75)">
    <rect width="250" height="70" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <path d="M20 20 Q50 5 80 20 T140 20 T200 20 M20 50 Q50 35 80 50 T140 50 T200 50" fill="none" stroke="#d97706" stroke-width="2.5"/>
    <text x="125" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#b45309">AIR-COOLED CONDENSER</text>
    <text x="125" y="85" text-anchor="middle" font-family="monospace" font-size="10" fill="#d97706">Heat Rejection &rarr; Liquid Subcooling</text>
  </g>

  <!-- Liquid Line to TXV -->
  <path d="M180 110 L100 110 L100 230" fill="none" stroke="#d97706" stroke-width="3"/>
  
  <!-- Filter Drier in Liquid Line -->
  <g transform="translate(85, 150)">
    <rect width="30" height="50" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="15" y="28" text-anchor="middle" font-family="monospace" font-size="8" fill="#475569" transform="rotate(-90 15 28)">FILTER DRIER</text>
  </g>

  <!-- 3. Expansion Device (Left middle) -->
  <g transform="translate(70, 230)">
    <polygon points="10,0 50,0 30,25" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <polygon points="10,50 50,50 30,25" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="70" y="30" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284c7">TXV / Metering</text>
  </g>

  <!-- Low Pressure Feed to Evaporator -->
  <path d="M100 280 L100 330 L180 330" fill="none" stroke="#0284c7" stroke-width="3"/>
  <polygon points="170,325 185,330 170,335" fill="#0284c7"/>
  <text x="105" y="320" font-family="monospace" font-size="10" fill="#0284c7">Cold Liquid/Gas</text>

  <!-- 4. Evaporator (Bottom Left/Center) -->
  <g transform="translate(180, 295)">
    <rect width="250" height="70" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <path d="M20 20 Q50 35 80 20 T140 20 T200 20 M20 50 Q50 65 80 50 T140 50 T200 50" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <text x="125" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#0369a1">CABINET EVAPORATOR</text>
    <text x="125" y="85" text-anchor="middle" font-family="monospace" font-size="10" fill="#0284c7">Heat Absorption &rarr; Useful Cooling</text>
  </g>

  <!-- Suction Line returning to Compressor -->
  <path d="M430 330 L575 330 L575 250" fill="none" stroke="#0284c7" stroke-width="3"/>
  <polygon points="570,260 575,245 580,260" fill="#0284c7"/>
  <text x="470" y="320" font-family="monospace" font-size="10" fill="#0284c7">Low-Pressure Suction Vapour</text>
</svg>
